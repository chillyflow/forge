# Publisher: https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct

[model]
context = 16384

[inference]
gpu_layers = "auto"
temperature = 0.0
seed = 42
reuse_prefix = true
grammar_fast_path = true
speculative = false

[agent]
output_reserve = 2048
